plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'kotlinx-serialization'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs.kotlin'
}

// Read me for better understanding of the code
// https://developer.android.com/build/migrate-to-ksp#groovy

android {
    compileSdk 35
    defaultConfig {
        namespace "com.davidbronn.movietmdb"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        Properties properties = new Properties()
        properties.load(project.rootProject.file('movie.properties').newDataInputStream())
        def apiKey = properties.getProperty("MOVIE_API_KEY")

        buildConfigField "String", "BASE_URL", "\"https://api.themoviedb.org/3/\""
        buildConfigField("String", "MOVIE_API_KEY", "\"$apiKey\"")

        testInstrumentationRunner "com.davidbronn.movietmdb.MovieTmdbTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding = true
        buildConfig = true
    }
}

dependencies {
    // Google Dependencies
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.fragment.ktx
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // Coroutines Dependencies
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // Lifecycle
    implementation libs.androidx.lifecycle.extensions
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.ktx

    // Hilt Dependencies
    implementation libs.hilt.android
    kapt libs.dagger.hilt.android.compiler

    // Networking - Ktor
    implementation libs.ktor.client.core
    implementation libs.ktor.client.android
    implementation libs.ktor.client.content.negotiation
    implementation libs.ktor.serialization.kotlinx.json
    implementation libs.ktor.client.logging
    implementation libs.kotlinx.serialization.json

    // Paging Dependencies
    implementation libs.androidx.paging.runtime.ktx
    testImplementation libs.androidx.paging.testing

    // Glide
    implementation libs.glide
    kapt libs.glide.compiler

    // Palette
    implementation libs.androidx.palette.ktx

    // Navigation Components
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.navigation.fragment.ktx

    // Timber
    implementation libs.timber

    // Testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.core.testing
    testImplementation libs.turbine

    // Android Instrumentation Testing
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.contrib
    androidTestImplementation libs.androidx.test.espresso.intents
    androidTestImplementation libs.androidx.fragment.testing
    androidTestImplementation libs.hilt.android.testing
    androidTestImplementation libs.mockito.core
    androidTestImplementation libs.mockito.kotlin
    kaptAndroidTest libs.dagger.hilt.android.compiler

}